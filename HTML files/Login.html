<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log in</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../CSS files/styles.css" />
</head>
<body>
  <div class="navbar">
    <img src="../Image/images-removebg-preview.png" alt="Logo" />
  </div>

  <div class="container mt-3">
    <div class="main">
      <header>
        <div class="navi text-center mb-4">
            <button class="btn btn-primary m-2"><a href="#">Refresh</a></button>
        <div class="navi text-center mb-4">
          <button class="btn btn-primary m-2"><a href="#admin">Admin Log In</a></button>
          <button class="btn btn-primary m-2"><a href="#doctor">Doctor Log In</a></button>
          <button class="btn btn-primary m-2"><a href="#patient">Patient Log In</a></button>
        </div>
      </header>

      <div class="content">
        <!-- stay normal -->
         <section id="#"></section>
        <!-- Admin Login -->
        <section id="admin" class="login-section">
          <div class="login-container">
            <h2>Admin</h2>
            <label for="admin-username">Username (Alphanumeric):</label>
            <input type="text" id="admin-username" name="username" placeholder="Enter username"
              pattern="[A-Za-z0-9]+" title="Alphanumeric only" required />

            <label for="admin-password">Password (Letters & Numbers):</label>
            <input type="password" id="admin-password" name="password" placeholder="Enter password"
              pattern="(?=.*[0-9])(?=.*[a-zA-Z]).{6,}" title="At least one letter and one number" required />

            <div id="errorMessage"></div>
            <button type="submit"><a href="/index.html">Log In</a></button>
            <p>Don’t have an account? <a href="Signup.html">Sign Up</a></p>
          </div>
        </section>

        <!-- Doctor Login -->
        <section id="doctor" class="login-section">
          <div class="login-container">
            <h2>Doctor Log In</h2>
            <label for="doctor-username">Username (Alphanumeric):</label>
            <input type="text" id="doctor-username" name="username" placeholder="Enter username"
              pattern="[A-Za-z0-9]+" title="Alphanumeric only" required />

            <label for="doctor-password">Password (Letters & Numbers):</label>
            <input type="password" id="doctor-password" name="password" placeholder="Enter password"
              pattern="(?=.*[0-9])(?=.*[a-zA-Z]).{6,}" title="At least one letter and one number" required />

            <div id="errorMessage"></div>
            <button type="submit"><a href="#">Log In</a></button>
            <p>Don’t have an account? <a href="Signup.html">Sign Up</a></p>
          </div>
        </section>

        <!-- Patient Login -->
        <section id="patient" class="login-section">
          <div class="login-container">
            <h2>Patient Log In</h2>
            <label for="patient-username">Username (Alphanumeric):</label>
            <input type="text" id="patient-username" name="username" placeholder="Enter username"
              pattern="[A-Za-z0-9]+" title="Alphanumeric only" required />

            <label for="patient-password">Password (Letters & Numbers):</label>
            <input type="password" id="patient-password" name="password" placeholder="Enter password"
              pattern="(?=.*[0-9])(?=.*[a-zA-Z]).{6,}" title="At least one letter and one number" required />

            <div id="errorMessage"></div>
            <button type="submit"><a href="../index.html">Log In</a></button>
            <p>Don’t have an account? <a href="Signup.html">Sign Up</a></p>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
